name: Render 3D Short
on: [push, workflow_dispatch]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps and render
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64 || sudo apt-get install -y ffmpeg unzip libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2
          mkdir -p fake-pilot-short
          unzip -o fake-pilot-3d-short.zip -d fake-pilot-short
          PROJ_DIR=$(dirname "$(find fake-pilot-short -name package.json | head -n 1)")
          cd "$PROJ_DIR"
          sed -i 's/"@types\/react-dom": "\^18.3.12"/"@types\/react-dom": "^18.3.1"/' package.json
          npm install --legacy-peer-deps --no-audit --no-fund
          mkdir -p out
          npx remotion render src/index.ts FakePilotShort out/video.mp4 --codec h264 --crf 16 --scale 1.3333 --gl=angle --concurrency=2
          ffmpeg -y -i out/video.mp4 -i public/mix.wav -c:v copy -c:a aac -b:a 192k -map 0:v:0 -map 1:a:0 "${{ github.workspace }}/final_fake_pilot.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: final_fake_pilot
          path: final_fake_pilot.mp4
