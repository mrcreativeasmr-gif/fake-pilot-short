name: Render 3D Short
on: [push, workflow_dispatch]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps and render
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64 || sudo apt-get install -y ffmpeg unzip libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2
          mkdir -p fake-pilot-short
          unzip -o fake-pilot-3d-short.zip -d fake-pilot-short
          PROJ_DIR=$(dirname "$(find fake-pilot-short -name package.json | head -n 1)")
          cd "$PROJ_DIR"
          sed -i 's/"@types\/react-dom": "\^18.3.12"/"@types\/react-dom": "^18.3.1"/' package.json
          sed -i 's/"angle"/"swangle"/' remotion.config.ts
          sed -i 's/import { tone, untone } from "\.\/shade";/import { twoTone } from "\.\/shade";/' src/videos/fakePilot/build.ts
          sed -i 's/tone(new THREE.MeshStandardMaterial({ color, roughness, metalness: 0.05 }))/twoTone(new THREE.MeshLambertMaterial({ color }))/' src/videos/fakePilot/build.ts
          sed -i 's/untone(new THREE.MeshBasicMaterial(\([^)]*new THREE.Color([^)]*)\s*}\)))/new THREE.MeshBasicMaterial(\1)/g' src/videos/fakePilot/build.ts
          cat << 'EOF' > src/videos/fakePilot/world.ts
          import * as THREE from "three";
          import { buildWorld, Kit } from "./build";
          import { Cast } from "./cast";
          import { camAt, SHOTS } from "./story";
          import { LIGHTS, LOOK } from "./lights";
          import { TONE, CHAR, untone } from "./shade";
          export class World {
            root = new THREE.Group();
            sun = new THREE.DirectionalLight(0xffffff, 1.5);
            amb = new THREE.AmbientLight(0xffffff, 0.5);
            skyMat: THREE.ShaderMaterial;
            cast: Cast;
            constructor(_kit: Kit) {
              buildWorld(this.root);
              this.cast = new Cast(this.root);
              this.sun.castShadow = true;
              this.sun.shadow.mapSize.set(1024, 1024);
              this.root.add(this.sun, this.sun.target, this.amb);
              this.skyMat = new THREE.ShaderMaterial({
                side: THREE.BackSide, depthWrite: false,
                uniforms: { uTop: { value: untone("#3e7fd2") }, uHor: { value: untone("#b8d0ec") } },
                vertexShader: `varying vec3 vPos; void main() { vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
                fragmentShader: `uniform vec3 uTop; uniform vec3 uHor; varying vec3 vPos; void main() { float h = clamp(normalize(vPos).y * 1.8, 0.0, 1.0); gl_FragColor = vec4(mix(uHor, uTop, pow(h, 0.75)), 1.0); }`,
              });
              this.root.add(new THREE.Mesh(new THREE.SphereGeometry(500, 16, 12), this.skyMat));
            }
            update(id: number, f: number, cam: THREE.PerspectiveCamera, scene: THREE.Scene): THREE.Vector3 {
              const preset = SHOTS[id - 1].light, L = LIGHTS[preset], K = LOOK[preset], c = camAt(id, f);
              cam.position.set(...c.pos); cam.fov = c.fov; cam.updateProjectionMatrix(); cam.lookAt(...c.look); cam.rotateZ(c.roll);
              const fwd = new THREE.Vector3(c.look[0] - c.pos[0], 0, c.look[2] - c.pos[2]).normalize();
              const az = (L.az * Math.PI) / 180, el = (L.el * Math.PI) / 180;
              const hx = fwd.x * Math.cos(az) - fwd.z * Math.sin(az), hz = fwd.x * Math.sin(az) + fwd.z * Math.cos(az);
              const dir = new THREE.Vector3(hx * Math.cos(el), Math.sin(el), hz * Math.cos(el)).normalize();
              this.sun.position.set(c.look[0] + dir.x * 30, c.look[1] + dir.y * 30, c.look[2] + dir.z * 30);
              this.sun.target.position.set(...c.look); this.sun.color.set(L.sunCol); this.sun.intensity = L.sunI;
              untone(L.top, this.skyMat.uniforms.uTop.value); untone(L.hor, this.skyMat.uniforms.uHor.value);
              scene.fog = new THREE.Fog(untone(L.fog), L.fogNear, L.fogFar);
              TONE.uLitCol.value.set(...L.lit); TONE.uShadeCol.value.set(...L.shade); TONE.uShadeLift.value.set(...L.lift);
              TONE.uLambert.value = L.lambert; TONE.uSideK.value = L.sideK; TONE.uTerm.value = L.term; TONE.uBounce.value.set(...K.bounce); TONE.uSat.value = K.sat;
              CHAR.uCharTint.value.set(...L.charTint); CHAR.uCharShade.value = L.charShade; CHAR.uGrad.value = L.charGrad; CHAR.uBodyGrad.value = L.bodyGrad; CHAR.uSideTint.value.set(...L.sideTint);
              this.cast.update(id, f, c.pos);
              return new THREE.Vector3(...c.look);
            }
          }
          EOF
          npm install --legacy-peer-deps --no-audit --no-fund
          mkdir -p out
          npx remotion render src/index.ts FakePilotShort out/video.mp4 --codec h264 --crf 16 --scale 1.3333 --gl=swangle --concurrency=2
          ffmpeg -y -i out/video.mp4 -i public/mix.wav -c:v copy -c:a aac -b:a 192k -map 0:v:0 -map 1:a:0 "${{ github.workspace }}/final_fake_pilot.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: final_fake_pilot
          path: final_fake_pilot.mp4
          
